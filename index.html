else if(pg=="p"){const p=P.find(x=>x.id==a);if(!p){app.innerHTML=`<div class="box">${t("empty")}</div>`;return}

function addC(id,buy){const p=P.find(x=>x.id==id),l=line(p),e=cart.find(c=>c.id==l.id&&c.size==l.size&&c.color==l.color);if(e)e.qty+=l.qty;else cart.push(l);save();go(buy?"checkout":"cart")}
function cq(i,d){cart[i].qty=Math.max(1,cart[i].qty+d);save();draw()}
function msg(items,c){let m="🛍️ *New Order – SAHU MART*\n\n"+items.map((x,i)=>`${i+1}. ${x.name}\n   Size: ${x.size||"-"}, Colour: ${x.color||"-"}, Qty: ${x.qty}, Price: ${inr(x.price)}`).join("\n")+`\n\n*Total: ${inr(items.reduce((a,x)=>a+x.price*x.qty,0))}*`;
if(c)m+=`\n\n*Customer:* ${c.n}\n*Phone:* ${c.ph}\n*Address:* ${c.ad}, ${c.ci}, ${c.st} - ${c.pn}\n*Payment:* ${c.pm}`;return m}
function waOne(id){open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg([line(P.find(x=>x.id==id))])),"_blank")}
async function order(e){e.preventDefault();const f=new FormData(e.target),c=Object.fromEntries(f),items=cart.slice(),total=items.reduce((a,x)=>a+x.price*x.qty,0);
open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg(items,c)),"_blank");cart=[];save();go("cart")}
/* ---------- Admin ---------- */
function admin(){const app=$("app");if(!isAdmin){app.innerHTML=`<h2>Admin</h2><div class="box">Admin access is only for the store owner. Open this page while signed in to the owner's claude.ai account.</div>`;return}
const p=edit||{};app.innerHTML=`<h2>Admin Dashboard</h2><form class="box" onsubmit="return saveP(event)"><b>${p.id?"Edit":"Add"} product</b><input name="name" placeholder="Product name" required value="${esc(p.name)}"><div class="chips" style="flex-wrap:wrap">${CATS.map(c=>`<label class="chip"><input type="checkbox" name="cats" value="${c[0]}" style="width:auto;margin:0 4px 0 0" ${(p.cats||[]).includes(c[0])?"checked":""}>${c[1]}</label>`).join("")}</div>
<div class="row"><input name="price" type="number" min="1" placeholder="Price ₹" required value="${p.price||""}" style="flex:1"><input name="disc" type="number" min="0" max="90" placeholder="Discount %" value="${p.disc||""}" style="flex:1"><input name="stock" type="number" min="0" placeholder="Stock" required value="${p.stock??""}" style="flex:1"></div>
<input name="sizes" placeholder="Sizes, comma separated (S,M,L,XL)" value="${esc((p.sizes||[]).join(","))}"><input name="colors" placeholder="Colours, comma separated (Red,Blue)" value="${esc((p.colors||[]).join(","))}"><textarea name="desc" rows="3" placeholder="Description">${esc(p.desc)}</textarea>
<label>Photos (multiple)</label><input type="file" name="files" accept="image/*" multiple><div class="mu">${(p.imgs||[]).length} existing photo(s) kept; new ones are added.</div><div class="row"><button class="btn">Save product</button>${p.id?`<button type="button" class="btn o" onclick="edit=null;admin()">Cancel</button>`:""}</div></form>
<div class="box tb"><b>Products (${P.length})</b><table>${P.map(x=>`<tr><td>${esc(x.name)}</td><td>${inr(fin(x))}</td><td>${x.stock}</td><td><button class="btn o s" onclick="edit=P.find(y=>y.id=='${x.id}');admin();scrollTo(0,0)">Edit</button> <button class="btn o s" onclick="delP('${x.id}')">Delete</button></td></tr>`).join("")}</table></div>
<div class="box mu">Orders arrive as WhatsApp messages on +91 7318518830 – that is your order record.</div>`}
async function saveP(e){e.preventDefault();const f=new FormData(e.target),sp=s=>String(f.get(s)||"").split(",").map(x=>x.trim()).filter(Boolean),id=edit?.id||"p"+Date.now();let imgs=edit?.imgs||[];
try{const as=await claude.use("assets");for(const fl of f.getAll("files"))if(fl.size){const r=await as.upload(fl);imgs=[...imgs,r.id]}}catch(x){alert("Photo upload failed: "+(x.message||x))}
const d={name:f.get("name"),cats:f.getAll("cats"),flags:f.getAll("cats").filter(c=>c=="new"||c=="best"),price:+f.get("price"),disc:+f.get("disc")||0,stock:+f.get("stock"),sizes:sp("sizes"),colors:sp("colors"),desc:f.get("desc"),imgs};
try{await db.collection("products").doc(id).set(d);edit=null}catch(x){alert("Could not save: "+(x.message||x))}admin()}
async function delP(id){if(confirm("Delete this product?"))try{await db.collection("products").doc(id).delete()}catch(x){alert("Could not delete")}}
function router(){const h=location.hash.slice(1).split("/");route=[h[0]||"home",h[1]];draw()}
window.addEventListener("hashchange",router);
cart=LS("sm_cart")||[];lang=LS("sm_lang")||"en";save();chrome();router();
(async()=>{try{user=await claude.use("user");isAdmin=!!(user&&user.canEdit());db=await claude.use("db");
if(db){db.collection("products").onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));if(["home","shop","p"].includes(route[0]))draw();if(route[0]=="admin")admin()});}
if(route[0]=="admin")admin()}catch(e){}})();
</script></body></html>
